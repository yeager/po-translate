name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/po-translate-ai
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest polib
      - run: pytest -q
      - name: Verify project version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          module = {}
          exec(pathlib.Path("po_translate.py").read_text(), module)
          assert project["project"]["version"] == module["__version__"]
          PY
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

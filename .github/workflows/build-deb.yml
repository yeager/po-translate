name: Build .deb
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          set -e
          PKG="po-translate"
          PYNAME="po_translate"
          VER=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('po_translate.py').read()).group(1))")
          echo "Building ${PKG} ${VER}"

          sudo apt-get install -y gettext

          ROOT="pkg-deb/${PKG}"
          mkdir -p ${ROOT}/usr/lib/python3/dist-packages
          mkdir -p ${ROOT}/usr/bin
          mkdir -p ${ROOT}/usr/share/locale
          mkdir -p ${ROOT}/usr/share/man/man1
          mkdir -p ${ROOT}/DEBIAN

          # Single-file module
          cp po_translate.py ${ROOT}/usr/lib/python3/dist-packages/

          # Launcher
          printf '#!/usr/bin/env python3\nimport sys\nfrom po_translate import main\nsys.exit(main())\n' > ${ROOT}/usr/bin/${PKG}
          chmod 755 ${ROOT}/usr/bin/${PKG}

          # Translations
          for po in po/*.po; do
            [ -f "$po" ] || continue
            lang=$(basename "$po" .po)
            [ "$lang" = "README" ] && continue
            mkdir -p ${ROOT}/usr/share/locale/${lang}/LC_MESSAGES
            msgfmt -o ${ROOT}/usr/share/locale/${lang}/LC_MESSAGES/${PKG}.mo "$po"
          done

          # Man page
          if [ -f man/${PKG}.1 ]; then
            cp man/${PKG}.1 ${ROOT}/usr/share/man/man1/
          fi

          # DEBIAN/control
          printf 'Package: %s\nVersion: %s-1\nArchitecture: all\nMaintainer: Daniel Nylander <daniel@danielnylander.se>\nDepends: python3 (>= 3.9)\nSection: utils\nPriority: optional\nHomepage: https://github.com/yeager/po-translate\nDescription: Batch translate PO/TS files using AI\n' "${PKG}" "${VER}" > ${ROOT}/DEBIAN/control

          dpkg-deb --build --root-owner-group ${ROOT}
          mv pkg-deb/*.deb .

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('po_translate.py').read()).group(1))")
          DEB="po-translate_${VER}-1_all.deb"
          gh release upload "v${VER}" "$DEB" --clobber 2>/dev/null || \
          gh release upload "${{ github.ref_name }}" "$DEB" --clobber 2>/dev/null || true

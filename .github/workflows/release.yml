name: Build .deb

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' po_translate.py)" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          PKG=po-translate
          VER=${{ steps.version.outputs.version }}
          ROOT=pkg-deb/${PKG}_${VER}-1_all
          mkdir -p ${ROOT}/DEBIAN
          mkdir -p ${ROOT}/usr/bin
          mkdir -p ${ROOT}/usr/lib/python3/dist-packages
          mkdir -p ${ROOT}/usr/share/man/man1

          cp po_translate.py ${ROOT}/usr/lib/python3/dist-packages/
          cat > ${ROOT}/usr/bin/${PKG} << 'WRAPPER'
          #!/usr/bin/python3
          import sys
          from po_translate import main
          sys.exit(main())
          WRAPPER
          chmod 755 ${ROOT}/usr/bin/${PKG}

          # English man page
          gzip -9cn data/man/${PKG}.1 > ${ROOT}/usr/share/man/man1/${PKG}.1.gz

          # Translated man pages
          for langdir in man/*/; do
            [ -d "$langdir" ] || continue
            lang=$(basename "$langdir")
            [ "$lang" = "en" ] && continue
            for manfile in "$langdir"*.1; do
              [ -f "$manfile" ] || continue
              mkdir -p ${ROOT}/usr/share/man/${lang}/man1
              gzip -9cn "$manfile" > ${ROOT}/usr/share/man/${lang}/man1/$(basename "$manfile").gz
            done
          done

          # Metainfo
          [ -f io.github.yeager.po-translate.metainfo.xml ] && {
            mkdir -p ${ROOT}/usr/share/metainfo
            cp io.github.yeager.po-translate.metainfo.xml ${ROOT}/usr/share/metainfo/
          }

          cat > ${ROOT}/DEBIAN/control << EOF
          Package: ${PKG}
          Version: ${VER}-1
          Architecture: all
          Maintainer: Daniel Nylander <daniel@danielnylander.se>
          Depends: python3 (>= 3.9)
          Section: devel
          Priority: optional
          Homepage: https://github.com/yeager/${PKG}
          Description: Translate PO files using multiple translation services
           po-translate translates gettext PO files using various services
           including DeepL, Google, OpenAI, Anthropic, and more.
          EOF
          sed -i 's/^          //' ${ROOT}/DEBIAN/control

          [ -f debian/postinst ] && install -m 755 debian/postinst ${ROOT}/DEBIAN/
          [ -f debian/prerm ] && install -m 755 debian/prerm ${ROOT}/DEBIAN/

          dpkg-deb --build --root-owner-group ${ROOT}
          mv pkg-deb/*.deb .

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.version.outputs.version }}
          gh release upload "v${VER}" po-translate_${VER}-1_all.deb --clobber 2>/dev/null || \
          gh release upload "${GITHUB_REF_NAME}" po-translate_${VER}-1_all.deb --clobber

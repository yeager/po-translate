name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rpm gettext

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' po_translate.py)" >> $GITHUB_OUTPUT

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          VER=$VERSION
          PKG="po-translate-$VER"
          
          # Setup rpmbuild dirs
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create source tarball
          mkdir -p "$PKG"
          cp po_translate.py pyproject.toml LICENSE README.md po-translate.1 \
             io.github.yeager.po-translate.metainfo.xml "$PKG/"
          test -d po && cp -r po "$PKG/" || true
          tar czf ~/rpmbuild/SOURCES/"$PKG".tar.gz "$PKG"
          
          # Compile .mo files
          LOCALE_FILES=""
          if [ -d po ]; then
            for pofile in po/*.po; do
              [ -f "$pofile" ] || continue
              lang=$(basename "$pofile" .po)
              mkdir -p "$PKG/locale/$lang/LC_MESSAGES"
              msgfmt -o "$PKG/locale/$lang/LC_MESSAGES/po-translate.mo" "$pofile"
              LOCALE_FILES="/usr/share/locale/$lang/LC_MESSAGES/po-translate.mo"
            done
            # Rebuild tarball with .mo files
            tar czf ~/rpmbuild/SOURCES/"$PKG".tar.gz "$PKG"
          fi
          
          # Build locale %files lines
          LOCALE_LINES=""
          if [ -n "$LOCALE_FILES" ]; then
            LOCALE_LINES="/usr/share/locale/*/LC_MESSAGES/po-translate.mo"
          fi
          
          TODAY=$(LC_ALL=C date +"%a %b %d %Y")
          
          cat > ~/rpmbuild/SPECS/po-translate.spec << SPECEOF
          Name:           po-translate
          Version:        $VER
          Release:        1
          Summary:        Batch translate PO and TS localization files
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/po-translate
          Source0:        po-translate-$VER.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          
          %description
          A CLI tool for batch translating .po and .ts localization files using
          various translation services including OpenAI, Anthropic, DeepL, Google
          Cloud, Lingva, MyMemory, and LibreTranslate.
          
          %prep
          %setup -q
          
          %build
          
          %install
          mkdir -p %{buildroot}/usr/bin
          cat > %{buildroot}/usr/bin/po-translate << 'WRAPPER'
          #!/usr/bin/env python3
          import sys
          sys.path.insert(0, '/usr/share/po-translate')
          from po_translate import main
          sys.exit(main())
          WRAPPER
          chmod 755 %{buildroot}/usr/bin/po-translate
          
          mkdir -p %{buildroot}/usr/share/po-translate
          install -m644 po_translate.py %{buildroot}/usr/share/po-translate/po_translate.py
          
          install -Dm644 po-translate.1 %{buildroot}/usr/share/man/man1/po-translate.1
          install -Dm644 io.github.yeager.po-translate.metainfo.xml %{buildroot}/usr/share/metainfo/io.github.yeager.po-translate.metainfo.xml
          
          for mofile in locale/*/LC_MESSAGES/*.mo; do
            [ -f "\$mofile" ] || continue
            lang=\$(echo "\$mofile" | cut -d/ -f2)
            install -Dm644 "\$mofile" "%{buildroot}/usr/share/locale/\$lang/LC_MESSAGES/po-translate.mo"
          done
          
          %files
          %license LICENSE
          %doc README.md
          /usr/bin/po-translate
          /usr/share/po-translate/po_translate.py
          /usr/share/man/man1/po-translate.1*
          /usr/share/metainfo/io.github.yeager.po-translate.metainfo.xml
          $LOCALE_LINES
          
          %changelog
          * $TODAY Daniel Nylander <daniel@danielnylander.se> - $VER-1
          - Add --fuzzy flag to mark AI translations as needs-review
          SPEC
          
          # Fix indentation (heredoc adds leading spaces)
          sed -i 's/^          //' ~/rpmbuild/SPECS/po-translate.spec
          
          echo "=== SPEC ==="
          cat ~/rpmbuild/SPECS/po-translate.spec
          echo "=== TARBALL CONTENTS ==="
          tar tzf ~/rpmbuild/SOURCES/po-translate-$VER.tar.gz | head -30
          rpmbuild -ba --nodeps ~/rpmbuild/SPECS/po-translate.spec

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RPM=$(find ~/rpmbuild/RPMS -name "*.rpm" | head -1)
          if [ -n "$RPM" ]; then
            gh release upload "v${VERSION}" "$RPM" --clobber
          fi

name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' po_translate.py)" >> $GITHUB_OUTPUT

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: python3 {0}
        run: |
          import os, subprocess, textwrap, datetime
          version = os.environ["VERSION"]
          pkg = f"po-translate-{version}"
          home = os.path.expanduser("~")

          for d in ["BUILD","RPMS","SOURCES","SPECS","SRPMS"]:
              os.makedirs(f"{home}/rpmbuild/{d}", exist_ok=True)

          # Create source tarball
          os.makedirs(f"{pkg}", exist_ok=True)
          for f in ["po_translate.py", "pyproject.toml", "LICENSE", "README.md",
                     "po-translate.1", "io.github.yeager.po-translate.metainfo.xml"]:
              subprocess.run(f"cp {f} {pkg}/", shell=True, check=True)
          subprocess.run(f"test -d po && cp -r po {pkg}/ || true", shell=True, check=True)
          subprocess.run(f"tar czf {home}/rpmbuild/SOURCES/{pkg}.tar.gz {pkg}", shell=True, check=True)

          today = datetime.datetime.now().strftime("%a %b %d %Y")
          spec = textwrap.dedent(f"""\
          Name:           po-translate
          Version:        {version}
          Release:        1
          Summary:        Batch translate PO and TS localization files
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/po-translate
          Source0:        po-translate-%{{version}}.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9

          %description
          A CLI tool for batch translating .po and .ts localization files using
          various translation services including OpenAI, Anthropic, DeepL, Google
          Cloud, Lingva, MyMemory, and LibreTranslate.

          %prep
          %setup -q

          %build
          # Nothing to build — pure Python

          %install
          # CLI wrapper
          mkdir -p %{{buildroot}}/usr/bin
          cat > %{{buildroot}}/usr/bin/po-translate << 'WRAPPER'
          #!/usr/bin/env python3
          import sys, os
          sys.path.insert(0, '/usr/share/po-translate')
          from po_translate import main
          sys.exit(main())
          WRAPPER
          chmod 755 %{{buildroot}}/usr/bin/po-translate

          # Python module
          mkdir -p %{{buildroot}}/usr/share/po-translate
          install -m644 po_translate.py %{{buildroot}}/usr/share/po-translate/po_translate.py

          # Man page
          install -Dm644 po-translate.1 %{{buildroot}}/usr/share/man/man1/po-translate.1

          # Metainfo
          install -Dm644 io.github.yeager.po-translate.metainfo.xml %{{buildroot}}/usr/share/metainfo/io.github.yeager.po-translate.metainfo.xml

          # Locale files
          if [ -d po ]; then
            for pofile in po/*.po; do
              [ -f "$pofile" ] || continue
              lang=$(basename "$pofile" .po)
              mkdir -p "%{{buildroot}}/usr/share/locale/$lang/LC_MESSAGES"
              msgfmt -o "%{{buildroot}}/usr/share/locale/$lang/LC_MESSAGES/po-translate.mo" "$pofile" 2>/dev/null || true
            done
          fi

          %files
          %license LICENSE
          %doc README.md
          /usr/bin/po-translate
          /usr/share/po-translate/po_translate.py
          /usr/share/man/man1/po-translate.1*
          /usr/share/metainfo/io.github.yeager.po-translate.metainfo.xml
          /usr/share/locale/*/LC_MESSAGES/po-translate.mo

          %changelog
          * {today} Daniel Nylander <daniel@danielnylander.se> - {version}-1
          - Add --fuzzy flag to mark AI translations as needs-review
          """)
          with open(f"{home}/rpmbuild/SPECS/po-translate.spec", "w") as f:
              f.write(spec)

          subprocess.run(["rpmbuild", "-ba", "--nodeps",
                          f"{home}/rpmbuild/SPECS/po-translate.spec"], check=True)

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RPM=$(find ~/rpmbuild/RPMS -name "*.rpm" | head -1)
          if [ -n "$RPM" ]; then
            gh release upload "v${VERSION}" "$RPM" --clobber
          fi

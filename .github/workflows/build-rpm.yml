name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm python3-pip python3-setuptools

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' po_translate.py)" >> $GITHUB_OUTPUT

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: python3 {0}
        run: |
          import os, subprocess, textwrap, datetime
          version = os.environ["VERSION"]
          pkg = f"po-translate-{version}"
          home = os.path.expanduser("~")

          for d in ["BUILD","RPMS","SOURCES","SPECS","SRPMS"]:
              os.makedirs(f"{home}/rpmbuild/{d}", exist_ok=True)

          # Create proper source package with all needed files
          os.makedirs(f"{pkg}", exist_ok=True)
          subprocess.run(f"cp po_translate.py {pkg}/", shell=True, check=True)
          subprocess.run(f"cp pyproject.toml {pkg}/", shell=True, check=True)
          subprocess.run(f"cp LICENSE {pkg}/", shell=True, check=True)
          subprocess.run(f"cp README.md {pkg}/", shell=True, check=True)
          subprocess.run(f"cp po-translate.1 {pkg}/", shell=True, check=True)
          subprocess.run(f"cp io.github.yeager.po-translate.metainfo.xml {pkg}/", shell=True, check=True)
          subprocess.run(f"test -d data && cp -r data {pkg}/ || true", shell=True, check=True)
          subprocess.run(f"test -d po && cp -r po {pkg}/ || true", shell=True, check=True)
          subprocess.run(f"tar czf {home}/rpmbuild/SOURCES/po-translate-{version}.tar.gz {pkg}", shell=True, check=True)

          today = datetime.datetime.now().strftime("%a %b %d %Y")
          spec = textwrap.dedent(f"""\
          Name:           po-translate
          Version:        {version}
          Release:        1
          Summary:        Batch translate PO and TS localization files
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/po-translate
          Source0:        %{{name}}-%{{version}}.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          BuildRequires:  python3-pip
          BuildRequires:  python3-setuptools

          %description
          A CLI tool for batch translating PO and TS files using various translation APIs.

          %prep
          %setup -q

          %build
          # Install to temporary directory using pip
          python3 -m pip install --no-deps --target ./build_install .

          %install
          # Install the Python package
          mkdir -p %{{buildroot}}%{{python3_sitelib}}
          cp -r build_install/* %{{buildroot}}%{{python3_sitelib}}/

          # Install the CLI binary
          mkdir -p %{{buildroot}}%{{_bindir}}
          python3 -c "
          import sys, os
          sys.path.insert(0, 'build_install')
          from setuptools import setup
          from setuptools.command.install_scripts import install_scripts
          
          # Create wrapper script for po-translate
          script_content = '''#!/usr/bin/env python3
          import sys
          from po_translate import main
          if __name__ == '__main__':
              sys.exit(main())
          '''
          
          with open('%{{buildroot}}%{{_bindir}}/po-translate', 'w') as f:
              f.write(script_content)
          "
          chmod 755 %{{buildroot}}%{{_bindir}}/po-translate

          # Install man page
          install -Dm644 po-translate.1 %{{buildroot}}%{{_mandir}}/man1/po-translate.1

          # Install metainfo
          install -Dm644 io.github.yeager.po-translate.metainfo.xml %{{buildroot}}%{{_datadir}}/metainfo/io.github.yeager.po-translate.metainfo.xml

          # Install locale files if they exist
          if [ -d data ]; then
            for mo in data/locale/*/LC_MESSAGES/*.mo; do
              [ -f "$mo" ] || continue
              lang=$(echo "$mo" | cut -d/ -f3)
              install -Dm644 "$mo" "%{{buildroot}}%{{_datadir}}/locale/$lang/LC_MESSAGES/po-translate.mo"
            done
          fi

          %files
          %license LICENSE
          %{{_bindir}}/po-translate
          %{{python3_sitelib}}/po_translate.py*
          %{{python3_sitelib}}/po_translate_ai-*
          %{{_mandir}}/man1/po-translate.1*
          %{{_datadir}}/metainfo/io.github.yeager.po-translate.metainfo.xml
          %{{_datadir}}/locale/*/LC_MESSAGES/po-translate.mo

          %changelog
          * {today} Daniel Nylander <daniel@danielnylander.se> - {version}-1
          - Fixed RPM to include proper Python package and CLI binary
          """)
          with open(f"{home}/rpmbuild/SPECS/po-translate.spec", "w") as f:
              f.write(spec)

          subprocess.run(["rpmbuild", "-ba", "--nodeps", f"{home}/rpmbuild/SPECS/po-translate.spec"], check=True)

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload "v${VERSION}" \
            ~/rpmbuild/RPMS/noarch/po-translate-${VERSION}-1.noarch.rpm \
            --clobber
